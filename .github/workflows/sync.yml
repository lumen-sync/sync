name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        default: "production"

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read
  models: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}
          path: src
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run
        working-directory: src/services/runner
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          BUDGET_D1_WRITES: "72000"
          BUDGET_D1_READS: "4000000"
          RUNNER_MAX_LLM_JOBS: "300"
          TARGET: ${{ github.event.inputs.target || 'production' }}
        run: |
          case "$TARGET" in staging|production) ;; *) echo "bad target"; exit 1;; esac
          npx tsx src/cli.ts harvest --env "$TARGET" --quiet --minutes 20
